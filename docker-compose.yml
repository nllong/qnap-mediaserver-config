# There are many exported ports in this docker-compose file. Here is the mapping:
# Sabnzbd: 8990 -> 8080
# Sonarr: 8991 -> 8989
# Radarr: 8992 -> 7878
# Lidarr: 8993 -> 8686
# Prowlarr: 8994 -> 9696
# youtube download: 8995
# Speedtest Tracker: 8996 -> 80
# agregarr: 8997 -> 7171
# Plex: 32400 -> 32400
# Tautulli: 32401 -> 8181
# homeassistant: 9090 (external) -> 8321 (local) -> 8321

services:
  sabnzbd:
    image: linuxserver/sabnzbd
    container_name: sabnzbd
    user: "1000:100"
    environment:
      - TZ=US/Mountain
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /share/Container/media_apps/sabnzbd-config:/config
      - /share/Container/media_apps/downloads:/downloads
    ports:
      - 8990:8080
      - 9090:9090
    restart: unless-stopped
  sonarr:
    image: linuxserver/sonarr
    container_name: sonarr
    user: "1000:100"
    environment:
      - TZ=US/Denver
      - UMASK_SET=022
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /share/Container/media_apps/sonarr-config:/config
      # The download directory in sabnzbd and sonarr must be the same
      - /share/Container/media_apps/downloads:/downloads
      - /share/media/TVShows:/tv
    ports:
      - 8991:8989
    restart: unless-stopped
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    user: "1000:100"
    environment:
      - TZ=Etc/UTC
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /share/Container/media_apps/prowlarr-config:/config
    ports:
      - 8994:9696
    restart: unless-stopped
  radarr:
    image: linuxserver/radarr
    container_name: radarr
    user: "1000:100"
    environment:
      - TZ=US/Denver
      - UMASK_SET=022
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /share/Container/media_apps/radarr-config:/config
      # The download directory must be the same as in sabnzbd
      - /share/Container/media_apps/downloads:/downloads
      - /share/media/Movies:/movies
    ports:
      - 8992:7878
    restart: unless-stopped
  lidarr:
    # music manager
    image: linuxserver/lidarr
    container_name: lidarr
    user: "1000:100"
    environment:
      - TZ=US/Denver
      - UMASK_SET=022
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /share/Container/media_apps/lidarr-config:/config
      # The download directory must be the same as in sabnzbd
      - /share/Container/media_apps/downloads:/downloads
      - /share/media/Music:/music
    ports:
      - 8993:8686
    restart: unless-stopped
  #lazylibrarian:
  #  image: linuxserver/lazylibrarian
  #  container_name: lazylibrarian
  #  user: "1000:100"
  #  environment:
  #    - TZ=US/Denver
  #    - DOCKER_MODS=linuxserver/calibre-web:calibre|linuxserver/mods:lazylibrarian-ffmpeg #optional
  #  volumes:
  #    - /etc/localtime:/etc/localtime:ro
  #    - /share/Container/media_apps/lazylibrarian-config:/config
  #    - /share/Container/media_apps/downloads:/downloads
  #    - /share/media/Books:/books
  #  ports:
  #    - 8994:5299
  #  restart: unless-stopped
  plex:
    image: plexinc/pms-docker
    container_name: plex
    hostname: plexmediaserver
    # Must set puid and pgid in env var for plex
    environment:
      - TZ=US/Denver
      - PUID=1000
      - PGID=100
      - PLEX_CLAIM=claim-Wqx-HLschdbPd9r8XSDq
      - ADVERTISE_IP=http://192.168.1.199:32400/
    volumes:
      - /share/Container/media_apps/plex/database:/config
      - /share/Container/media_apps/plex/transcode/temp:/transcode
      - /share/media/Movies:/data/movies
      - /share/media/Music:/data/music
      - /share/media/TVShows:/data/tv_shows
      - /share/media/Videos:/data/home_movies
      - /share/media/MusicVideos:/data/music_videos
      - /share/media/MusicVideosChristmas:/data/music/music_videos_christmas
      - /share/media/Audiobooks:/data/audiobooks
    ports:
      - 32400:32400/tcp
      - 3005:3005/tcp
      - 8324:8324/tcp
      - 32469:32469/tcp
      # 1900 is DLNA, which I don't think I use with plex and it
      # conflicts with the NAS's media center DLNA
      - 1901:1900/udp
      - 32410:32410/udp
      - 32412:32412/udp
      - 32413:32413/udp
      - 32414:32414/udp
    restart: unless-stopped
  agregarr:
    image: agregarr/agregarr:latest
    container_name: agregarr
    volumes:
      - /share/Conatiner/agregarr-config:/app/config
      - /share/media/Movies:/data/movies
      - /share/media/TVShows:/data/tv
    environment:
      - TZ=US/Denver
      - PUID=1000
      - PGID=100
    ports:
      - 8997:7171
    restart: unless-stopped
  tautulli:
    image: ghcr.io/tautulli/tautulli
    container_name: tautulli
    restart: unless-stopped
    volumes:
      - /share/Container/media_apps/tautulli-config:/config
    # Must set puid and pgid in env var for this container
    environment:
      - TZ=America/Denver
      - PUID=10
      - PGID=100
    ports:
      - 32401:8181
  speedtest-tracker:
    image: lscr.io/linuxserver/speedtest-tracker:latest
    container_name: speedtest-tracker
    ports:
      - 8996:80
    volumes:
      - /share/Container/media_apps/speedtest-tracker-config/config:/config
      - /share/Container/media_apps/speedtest-tracker-config/data:/data
    # Must set puid and pgid in env var for this container
    environment:
      - TZ=US/Denver
      - APP_TIMEZONE=America/Denver
      - TZ=America/Denver
      - PHP_TZ=America/Denver
      - PUID=1000
      - PGID=100
      - APP_KEY=base64:aQUiYqT+HLveKshZe62ML3RhgmftQ8HmZI4pX558ZOo=
      # Use SQLite instead of MySQL
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/config/database/database.sqlite
      - SPEEDTEST_SCHEDULE=6 */2 * * *
      # Email settings for speedtest result notifications
      - MAIL_MAILER=smtp
      - MAIL_HOST=smtp.gmail.com
      - MAIL_PORT=587
      - MAIL_USERNAME=nicholas.lee.long@gmail.com
      - MAIL_PASSWORD=ghyo wyhk zxvv ycqj
      - MAIL_ENCRYPTION=tls
      - MAIL_FROM_ADDRESS=nicholas.lee.long@gmail.com
      - MAIL_FROM_NAME="Speedtest Tracker"
    restart: unless-stopped
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    restart: unless-stopped
    network_mode: host
    privileged: true
    user: "1000:100"
    environment:
      - TZ=America/Denver
    volumes:
      - /share/Container/media_apps/homeassistant-config/config:/config
      - /etc/localtime:/etc/localtime:ro
  cloudflare-ddns:
    image: favonia/cloudflare-ddns:1
    container_name: cloudflare-ddns
    network_mode: host
    user: "1000:100"
    read_only: true
    cap_drop: [all]
    # security_opt: [no-new-privileges:true]
    restart: unless-stopped

    environment:
      # Authentication
      - CLOUDFLARE_API_TOKEN=kesOugxNFlwSCljXe4g6wbxiLuEXSqJK3HC2OuZe

      # Domains to manage
      - DOMAINS=home.nicholaslong.org
      - IP4_DOMAINS=home.nicholaslong.org  # IPv4 only
      # - IP6_DOMAINS=                   # Disable IPv6 updates

      # Cloudflare settings - do not proxy, will remove DDNS functionality
      - PROXIED=false
      - TTL=1  # Automatic

      # IP detection
      - IP4_PROVIDER=cloudflare.trace
      - IP6_PROVIDER=none                 # Disable if no IPv6

      # Scheduling
      - UPDATE_CRON=@every 5m
      - UPDATE_ON_START=true
      - TZ=America/Denver

      # Monitoring
      - HEALTHCHECKS=https://hc-ping.com/170484c5-f503-4370-9a84-06031760a1db

      # Logging
      - EMOJI=true
      - QUIET=false

    # Store logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  frigate:
    container_name: frigate
    image: ghcr.io/blakeblackshear/frigate:stable
    user: "1000:100"
    restart: unless-stopped
    privileged: true
    network_mode: host
    shm_size: "512mb"

    volumes:
      - /share/Container/media_apps/frigate-config/config:/config
      - /share/Container/media_apps/frigate-config/media:/media/frigate
      #- /share/frigate:/media/frigate
      - /etc/localtime:/etc/localtime:ro

    devices:
      - /dev/dri:/dev/dri

    environment:
      FRIGATE_RTSP_PASSWORD: "p4szW0rd_for_me"
  cleanup:
    image: alpine
    container_name: sabnzbd-cleanup
    volumes:
      - /share/Container/media_apps/downloads:/downloads
    command: >
      sh -c "while true; do
               echo \"[cleanup] Running cleanup at $(date)\";
               find /downloads -type f -mtime +7 -print -delete;
               find /downloads -type d -empty -print -delete;
               echo \"[cleanup] Finished cleanup at $(date)\";
               sleep 86400;
             done"
    restart: unless-stopped
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
