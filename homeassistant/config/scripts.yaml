christmas_light_shuffle:
  mode: restart
  sequence:
  - repeat:
      while:
      - condition: state
        entity_id: input_boolean.christmas_shuffle_enabled
        state: 'on'
      sequence:
      - variables:
          color: "{{ [\n  [255, 0, 0],\n  [0, 180, 0],\n  [255, 200, 120],\n  [255,
            180, 60]\n] | random }}\n"
          wait_s: '{{ range(5, 31) | random }}'
      - target:
          entity_id:
          - light.front_room_left
          - light.front_room_right
          - light.front_wall_left
          - light.front_wall_right
          - light.main_room_left
          - light.main_room_middle
          - light.main_room_right
          - light.main_wall_left
          - light.main_wall_middle
          - light.main_wall_right
        data:
          brightness: 180
          transition: 2
        data_template:
          rgb_color: '{{ color }}'
        action: light.turn_on
      - delay:
          seconds: '{{ wait_s }}'
