start_roku_plex_play_music_videos:
  alias: Start Roku Plex + Play Music Videos
  mode: restart
  sequence:
  - target:
      entity_id: media_player.room_of_chairs
    action: media_player.turn_on
  - delay:
      seconds: 2
  - target:
      entity_id: media_player.room_of_chairs
    data:
      source: Plex - Free Movies & TV
    action: media_player.select_source
  - delay:
      seconds: 15
  - target:
      entity_id: media_player.plex_plex_for_roku_room_of_chairs
    data:
      media_content_type: playlist
      media_content_id: plex://77f6fbe55f513cbd0472c253a51b30dbcea711f9/720609?shuffle=1
    action: media_player.play_media
